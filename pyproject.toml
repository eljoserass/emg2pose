[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emg2pose"
version = "0.1.0"
description = "Surface electromyography data loading and hand pose estimation"
readme = "README.md"
authors = [{name = "CTRL Research Team, Meta Reality Labs"}]
# The original NumPy/SciPy/PyTorch pins have wheels through Python 3.12.
requires-python = ">=3.10,<3.13"
dependencies = [
    # Its original imports require the bundled UmeTrack as a separate package.
    "UmeTrack==0.1.0",
    "torch==2.3.1",
    "pytorch-lightning==2.2.2",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "h5py==3.11.0",
    "Unidecode==1.3.8",
    "pandas==2.2.2",
    "PyYAML==6.0.1",
    "click==8.1.7",
    "trio==0.25.1",
    "hydra-core==1.3.2",
    "plotly==5.24.1",
    "av==13.1.0",
    "opencv-python==4.10.0.84",
    "Pillow==11.0.0",
    "kaleido==0.2.1",
    "matplotlib==3.9.2",
    "mediapy==1.2.2",
    "joblib==1.4.2",
    "nbformat==5.10.4",
    # Imported directly by utils.py and visualization.py.
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
# Explicit wheel choices for Linux/Windows. macOS uses the PyPI wheel.
cpu = ["torch==2.3.1"]
cu121 = ["torch==2.3.1"]
notebook = ["ipykernel>=6.29,<7", "jupyterlab>=4.2,<5"]

[dependency-groups]
dev = [
    "pytest==8.2.2",
    "pre-commit==3.7.1",
    "black==24.4.2",
    "flake8==7.0.0",
    "mypy==1.10.0",
]

[tool.setuptools.packages.find]
include = ["emg2pose*"]
exclude = ["emg2pose.tests*"]

[tool.setuptools.package-data]
"emg2pose.UmeTrack" = ["dataset/*.json"]

[tool.uv]
conflicts = [[{extra = "cpu"}, {extra = "cu121"}]]

[tool.uv.sources]
umetrack = {path = "emg2pose/UmeTrack", editable = true}
torch = [
    {index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'"},
    {index = "pytorch-cu121", extra = "cu121", marker = "sys_platform != 'darwin'"},
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
